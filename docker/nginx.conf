worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen ${PORT};
        server_name _;
        root /var/www/html/public;
        index index.php index.html index.htm;

        # Laravel public directory
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Block access to hidden files
        location ~ /\.(?!well-known) {
            deny all;
        }

        # Static assets
        location ~* \.(?:css|js|map|jpg|jpeg|gif|png|ico|cur|svg|webp|avif|woff2?|eot|ttf|otf|ttc|mp4|webm|ogv|flac|oga|opus|wav|midi?|pdf|html|htm|txt)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param PHP_VALUE "upload_max_filesize = 20M \n post_max_size = 20M";
            include fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # Deny access to dot files
        location ~ /\.git {
            deny all;
        }

        # Deny access to storage (except for symlink from public)
        location ~ ^/storage/ {
            try_files $uri $uri/ =404;
        }
    }
}
